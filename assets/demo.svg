<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="528" viewBox="0 0 1000 528" role="img" aria-label="sqlloom output: a write-skew race found at read committed and repeatable read, safe at serializable">
<style>
  .l { font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; opacity: 0; animation: in .25s ease-out forwards; }
  @keyframes in { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
</style>
<rect width="1000" height="528" rx="10" fill="#0d1117"/>
<rect width="1000" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="1000" height="10" fill="#161b22"/>
<circle cx="20" cy="15" r="6" fill="#ff5f56"/><circle cx="40" cy="15" r="6" fill="#ffbd2e"/><circle cx="60" cy="15" r="6" fill="#27c93f"/>
  <text x="20" y="52" class="l" style="animation-delay:0.00s" xml:space="preserve"><tspan fill="#8b949e">$</tspan> npx sqlloom examples/on-call.mjs</text>
  <text x="20" y="72" class="l" style="animation-delay:0.30s" xml:space="preserve"></text>
  <text x="20" y="92" class="l" style="animation-delay:0.90s" xml:space="preserve"><tspan font-weight="700" fill="#f0f6fc">sqlloom</tspan> · 2 transactions (alice, bob)</text>
  <text x="20" y="112" class="l" style="animation-delay:1.02s" xml:space="preserve"></text>
  <text x="20" y="132" class="l" style="animation-delay:1.14s" xml:space="preserve"><tspan fill="#8b949e">  isolation level   schedules       result</tspan></text>
  <text x="20" y="152" class="l" style="animation-delay:1.26s" xml:space="preserve">  read committed    20 (all)        <tspan fill="#ff7b72">✗ UNSAFE</tspan>  18 of 20 break the invariant<tspan font-weight="700" fill="#f0f6fc"> ◂ yours</tspan></text>
  <text x="20" y="172" class="l" style="animation-delay:1.38s" xml:space="preserve">  repeatable read   20 (all)        <tspan fill="#ff7b72">✗ UNSAFE</tspan>  18 of 20 break the invariant</text>
  <text x="20" y="192" class="l" style="animation-delay:1.50s" xml:space="preserve">  serializable      20 (all)        <tspan fill="#7ee787">✓ safe</tspan>    <tspan fill="#e3b341">18 of 20 abort a transaction (40001/40P01): retry it in your code</tspan></text>
  <text x="20" y="212" class="l" style="animation-delay:1.62s" xml:space="preserve"></text>
  <text x="20" y="232" class="l" style="animation-delay:1.74s" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan> <tspan font-weight="700" fill="#f0f6fc">read committed</tspan>: invariant failed: nobody is on call</text>
  <text x="20" y="252" class="l" style="animation-delay:1.86s" xml:space="preserve"><tspan fill="#8b949e">  Shortest interleaving (2 context switches, replay "0.0.1.1.1.0"):</tspan></text>
  <text x="20" y="272" class="l" style="animation-delay:1.98s" xml:space="preserve"></text>
  <text x="20" y="292" class="l" style="animation-delay:2.10s" xml:space="preserve">  <tspan fill="#8b949e"> 1</tspan>  alice │ <tspan fill="#79c0ff">SELECT count(*)::int AS n FROM doctors WHERE on_call</tspan><tspan fill="#7ee787">  → 2</tspan></text>
  <text x="20" y="312" class="l" style="animation-delay:2.22s" xml:space="preserve">  <tspan fill="#8b949e"> 2</tspan>  alice │ <tspan fill="#79c0ff">UPDATE doctors SET on_call = false WHERE name = 'alice'</tspan><tspan fill="#7ee787">  → UPDATE 1</tspan></text>
  <text x="20" y="332" class="l" style="animation-delay:2.34s" xml:space="preserve">  <tspan fill="#8b949e"> 3</tspan>  bob   │ <tspan fill="#79c0ff">SELECT count(*)::int AS n FROM doctors WHERE on_call</tspan><tspan fill="#7ee787">  → 2</tspan></text>
  <text x="20" y="352" class="l" style="animation-delay:2.46s" xml:space="preserve">  <tspan fill="#8b949e"> 4</tspan>  bob   │ <tspan fill="#79c0ff">UPDATE doctors SET on_call = false WHERE name = 'bob'</tspan><tspan fill="#7ee787">  → UPDATE 1</tspan></text>
  <text x="20" y="372" class="l" style="animation-delay:2.58s" xml:space="preserve">  <tspan fill="#8b949e"> 5</tspan>  bob   │ <tspan fill="#d2a8ff">COMMIT</tspan></text>
  <text x="20" y="392" class="l" style="animation-delay:2.70s" xml:space="preserve">  <tspan fill="#8b949e"> 6</tspan>  alice │ <tspan fill="#d2a8ff">COMMIT</tspan></text>
  <text x="20" y="412" class="l" style="animation-delay:2.82s" xml:space="preserve"></text>
  <text x="20" y="432" class="l" style="animation-delay:2.94s" xml:space="preserve">  alice committed · bob committed</text>
  <text x="20" y="452" class="l" style="animation-delay:3.06s" xml:space="preserve">  doctors: [{"name":"alice","on_call":false},{"name":"bob","on_call":false}]</text>
  <text x="20" y="472" class="l" style="animation-delay:3.18s" xml:space="preserve"></text>
  <text x="20" y="492" class="l" style="animation-delay:3.30s" xml:space="preserve"><tspan fill="#ff7b72">✗</tspan> <tspan font-weight="700" fill="#f0f6fc">repeatable read</tspan>: invariant failed: nobody is on call — same interleaving as read committed</text>
</svg>
